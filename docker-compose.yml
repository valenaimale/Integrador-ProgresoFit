services:

  # ==================== BASE DE DATOS ====================
  postgres:
    image: postgres:16-alpine
    container_name: progresofit-postgres
    restart: always
    environment:
      POSTGRES_DB: progresofit
      POSTGRES_USER: progresofit_user
      POSTGRES_PASSWORD: progresofit_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U progresofit_user -d progresofit"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==================== BACKEND NODE.JS ====================
  backend:
    container_name: progresofit-backend
    restart: always
    build: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      PORT: 3000
      JWT_SECRET: tu_clave_secreta_super_segura_aqui_123456
      DB_HOST: postgres
      DB_USER: progresofit_user
      DB_PASSWORD: progresofit_pass
      DB_NAME: progresofit
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET}
      MP_SUCCESS_URL: ${MP_SUCCESS_URL:-http://localhost:8000/pago-exitoso}
      MP_FAILURE_URL: ${MP_FAILURE_URL:-http://localhost:8000/pago-fallido}
      MP_PENDING_URL: ${MP_PENDING_URL:-http://localhost:8000/pago-suscripcion}
      MP_NOTIFICATION_URL: ${MP_NOTIFICATION_URL}
    depends_on:
      postgres:
        condition: service_healthy

  # ==================== FRONTEND PHP ====================
  frontend:
    container_name: progresofit-frontend
    restart: always
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/vendor
    environment:
      API_BASE_URL: http://backend:3000
    depends_on:
      - backend

volumes:
  postgres_data:
